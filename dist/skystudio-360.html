<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkyStudio 360°</title>
  <meta name="description" content="Procedural 360° sky with 12 cloud types, day/sunset/night, eclipses, aircraft contrails and equirectangular PNG export. WebGL, runs in the browser." />
  <style>
:root {
  --glass: rgba(8, 15, 28, 0.86);
  --border: rgba(148, 163, 184, 0.28);
  --sky: #38bdf8;
  --emerald: #34d399;
  --amber: #fbbf24;
  --violet: #a78bfa;
  --rose: #fb7185;
}
* { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: #040b18; color: #f8fafc;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif;
  font-size: 13px;
}
.mono { font-family: 'SFMono-Regular', Consolas, 'JetBrains Mono', monospace; }

#glCanvas {
  position: fixed; inset: 0;
  width: 100vw; height: 100vh;
  display: block; z-index: 1;
  cursor: grab;
}
#glCanvas:active { cursor: grabbing; }
#glCanvas.mode-paint_ci,
#glCanvas.mode-paint_cu,
#glCanvas.mode-paint_cc,
#glCanvas.mode-erase,
#glCanvas.mode-wind { cursor: crosshair; }
#glCanvas.mode-sun,
#glCanvas.mode-moon { cursor: move; }

.glass {
  background: var(--glass);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--border);
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.48);
}

/* Top bar */
#topHud {
  position: fixed; top: 7px; left: 9px; right: 9px; z-index: 20;
  display: flex; align-items: center; justify-content: space-between;
  gap: 5px; flex-wrap: wrap; pointer-events: none;
}
.pointer-auto { pointer-events: auto; }

.status-pill {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 4px 11px; border-radius: 999px;
  max-width: 100%;
}
.live-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--emerald);
  box-shadow: 0 0 10px var(--emerald);
  animation: pulse 2.2s infinite ease-in-out;
  flex-shrink: 0;
}
@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.3); opacity: 0.55; }
}

.compass-badge {
  background: rgba(14, 165, 233, 0.22);
  border: 1px solid rgba(56, 189, 248, 0.45);
  color: #7dd3fc;
  padding: 2px 7px; border-radius: 999px;
  font-size: 10px; font-weight: 700;
}

.tool-group {
  display: inline-flex; align-items: center; gap: 3px;
  padding: 3px; border-radius: 999px; flex-wrap: wrap;
}
/* Editing tools are hidden by default and only shown when Edit Mode is toggled ON */
.edit-only {
  display: none !important;
}
body.edit-mode-active .edit-only.tool-group {
  display: inline-flex !important;
}
body.edit-mode-active .edit-only.ctrl-box {
  display: flex !important;
}
body.edit-mode-active .edit-only.pill-btn {
  display: inline-flex !important;
}

.pill-btn {
  background: rgba(15, 23, 42, 0.84);
  color: #e2e8f0;
  border: 1px solid rgba(148, 163, 184, 0.22);
  padding: 4px 8px; border-radius: 999px;
  font-size: 10.6px; font-weight: 600;
  cursor: pointer; display: inline-flex; align-items: center; gap: 3px;
  transition: all 0.14s ease;
  white-space: nowrap;
}
.pill-btn:hover { background: rgba(30, 41, 59, 0.96); border-color: rgba(148, 163, 184, 0.48); color: #fff; }
.pill-btn.active-tool {
  background: linear-gradient(135deg, rgba(14, 165, 233, 0.52), rgba(37, 99, 235, 0.44));
  border-color: #38bdf8; color: #fff;
  box-shadow: 0 0 12px rgba(56, 189, 248, 0.35);
}
.pill-btn.active-ctone {
  background: linear-gradient(135deg, rgba(14, 165, 233, 0.50), rgba(99, 102, 241, 0.46));
  border-color: #7dd3fc; color: #fff;
  box-shadow: 0 0 12px rgba(56, 189, 248, 0.38);
}
.pill-btn.active-bmode {
  background: linear-gradient(135deg, rgba(139, 92, 246, 0.48), rgba(14, 165, 233, 0.42));
  border-color: #c4b5fd; color: #fff;
  box-shadow: 0 0 12px rgba(167, 139, 250, 0.35);
}
.pill-btn.active-edit {
  background: linear-gradient(135deg, rgba(168, 85, 247, 0.52), rgba(56, 189, 248, 0.45));
  border-color: #d8b4fe; color: #fff;
  box-shadow: 0 0 14px rgba(168, 85, 247, 0.40);
}
.pill-btn.active-auto {
  background: linear-gradient(135deg, rgba(16, 185, 129, 0.42), rgba(14, 165, 233, 0.36));
  border-color: #34d399; color: #a7f3d0;
  box-shadow: 0 0 12px rgba(52, 211, 153, 0.28);
}
.pill-btn.active-tod {
  background: linear-gradient(135deg, rgba(245, 158, 11, 0.44), rgba(14, 165, 233, 0.38));
  border-color: #fbbf24; color: #fef3c7;
  box-shadow: 0 0 12px rgba(251, 191, 36, 0.32);
}
.pill-btn.active-eclipse {
  background: linear-gradient(135deg, rgba(244, 63, 94, 0.48), rgba(245, 158, 11, 0.42));
  border-color: #fb7185; color: #ffe4e6;
  box-shadow: 0 0 14px rgba(244, 63, 94, 0.38);
}
.pill-btn.library-btn {
  background: linear-gradient(135deg, rgba(56, 189, 248, 0.35), rgba(139, 92, 246, 0.35));
  border-color: #7dd3fc; color: #f0f9ff;
  box-shadow: 0 0 14px rgba(56, 189, 248, 0.28);
}
.pill-btn.export-btn {
  background: linear-gradient(135deg, rgba(245, 158, 11, 0.32), rgba(234, 88, 12, 0.28));
  border-color: rgba(251, 191, 36, 0.65); color: #fde68a;
}

/* Preset library */
#themeLibraryModal {
  position: fixed; top: 88px; left: 50%; transform: translateX(-50%);
  z-index: 40; width: min(1140px, calc(100vw - 20px));
  max-height: calc(100vh - 210px); overflow-y: auto;
  border-radius: 18px; padding: 12px 14px;
  display: none; flex-direction: column; gap: 10px;
}
#themeLibraryModal.open { display: flex; }
.theme-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(245px, 1fr)); gap: 7px;
}
.theme-card {
  background: rgba(15, 23, 42, 0.85);
  border: 1px solid rgba(148, 163, 184, 0.22);
  border-radius: 11px; padding: 8px 10px;
  cursor: pointer; text-align: left;
  transition: all 0.14s ease;
  display: flex; flex-direction: column; gap: 3px;
}
.theme-card:hover {
  background: rgba(30, 41, 59, 0.96);
  border-color: #38bdf8;
  transform: translateY(-1px);
}
.theme-card.active {
  background: linear-gradient(135deg, rgba(14, 165, 233, 0.36), rgba(37, 99, 235, 0.30));
  border-color: #38bdf8;
  box-shadow: 0 0 14px rgba(56, 189, 248, 0.32);
}
.theme-title { font-size: 11.5px; font-weight: 700; color: #fff; }
.theme-tag { font-size: 9.5px; color: #7dd3fc; font-weight: 600; }
.theme-desc { font-size: 10px; color: #cbd5e1; line-height: 1.3; }

/* Bottom dock: cloud types + sliders */
#bottomDock {
  position: fixed; bottom: 7px; left: 9px; right: 9px;
  z-index: 20;
  border-radius: 15px; padding: 6px 9px;
  display: flex; flex-direction: column; gap: 5px;
  transition: transform 0.26s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.22s ease;
}
#bottomDock.hidden-dock {
  transform: translateY(130%); opacity: 0; pointer-events: none;
}

/* 6 columns x 2 rows (4 x 3 on narrow screens); min-width: 0 keeps every chip visible */
.species-strip {
  display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px;
}
@media (max-width: 980px) {
  .species-strip { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
/* Physics & evolution card (top left, below the header) */
#physicsHudCard {
  position: fixed; top: 84px; left: 9px; z-index: 25;
  width: 318px; max-width: calc(100vw - 18px);
  border-radius: 14px; padding: 8px 10px;
  display: flex; flex-direction: column; gap: 6px;
  transition: transform 0.24s ease, opacity 0.22s ease;
}
#physicsHudCard.hidden-phys {
  transform: translateX(-115%); opacity: 0; pointer-events: none;
}
.phys-metrics-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;
  background: rgba(15, 23, 42, 0.78); border: 1px solid rgba(148, 163, 184, 0.18);
  border-radius: 8px; padding: 4px 6px; text-align: center;
}
.phys-m-lbl { font-size: 8.5px; color: #94a3b8; display: block; }
.phys-m-val { font-size: 10.2px; font-weight: 700; }
.evo-grid {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 3.5px;
}
.evo-btn {
  background: rgba(15, 23, 42, 0.82); border: 1px solid rgba(148, 163, 184, 0.22);
  color: #cbd5e1; border-radius: 7px; padding: 3.5px 6px; font-size: 9.6px; font-weight: 600;
  cursor: pointer; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  transition: all 0.14s ease;
}
.evo-btn:hover { background: rgba(30, 41, 59, 0.95); color: #fff; }
.evo-btn.active {
  background: linear-gradient(135deg, rgba(16, 185, 129, 0.36), rgba(14, 165, 233, 0.34));
  border-color: #34d399; color: #a7f3d0;
}
.species-chip {
  min-width: 0;
  background: rgba(15, 23, 42, 0.80);
  border: 1px solid rgba(148, 163, 184, 0.20);
  border-radius: 8px; padding: 3px 5px;
  color: #cbd5e1; cursor: pointer;
  text-align: center; transition: all 0.14s ease;
  display: flex; flex-direction: column; align-items: center; gap: 1px;
}
.species-chip:hover { background: rgba(30, 41, 59, 0.94); border-color: rgba(148, 163, 184, 0.48); color: #fff; }
.species-chip.rain-chip {
  border-color: rgba(96, 165, 250, 0.45);
  background: rgba(15, 28, 52, 0.86);
}
.species-chip.active {
  background: linear-gradient(135deg, rgba(14, 165, 233, 0.48), rgba(37, 99, 235, 0.40));
  border-color: #38bdf8; color: #fff;
  box-shadow: 0 0 12px rgba(56, 189, 248, 0.34);
}
.species-name { font-size: 10px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
.species-sub { font-size: 8.3px; color: #7dd3fc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }

.controls-row {
  display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)) auto; gap: 4px; align-items: center;
}
body.edit-mode-active .controls-row {
  grid-template-columns: repeat(12, minmax(0, 1fr)) auto;
}
@media (max-width: 1220px) {
  .controls-row, body.edit-mode-active .controls-row {
    grid-template-columns: repeat(5, minmax(0, 1fr));
  }
}
.ctrl-box {
  min-width: 0;
  background: rgba(15, 23, 42, 0.68);
  border: 1px solid rgba(148, 163, 184, 0.16);
  border-radius: 8px; padding: 3px 6px;
  display: flex; flex-direction: column; gap: 2px;
}
.ctrl-box.highlight-ctrl {
  border-color: rgba(56, 189, 248, 0.42);
  background: rgba(14, 30, 58, 0.78);
}
.ctrl-head {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 9.4px; color: #cbd5e1; white-space: nowrap; gap: 3px;
  overflow: hidden;
}
.ctrl-head span:first-child {
  overflow: hidden; text-overflow: ellipsis;
}
input[type="range"] {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 5px;
  background: rgba(51, 65, 85, 0.9);
  border-radius: 999px; outline: none; cursor: pointer;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 12px; height: 12px; border-radius: 50%;
  background: #38bdf8; border: 2px solid #e0f2fe;
  box-shadow: 0 0 6px rgba(56, 189, 248, 0.7);
}

#toast {
  position: fixed; top: 82px; left: 50%; transform: translateX(-50%);
  z-index: 50; padding: 7px 16px; border-radius: 999px;
  font-size: 12px; font-weight: 600; color: #e0f2fe;
  opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
}

/* Helpers that replaced inline styles */
.status-line { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.status-title { font-size: 11.3px; color: #fff; }
.fps-badge { font-size: 10px; color: #34d399; }
.status-hint { font-size: 9.6px; color: #bae6fd; margin-top: 1px; }
.sep { color: rgba(148, 163, 184, 0.4); font-size: 11px; padding: 0 1px; }
.lang-btn { border-color: rgba(125, 211, 252, 0.55); color: #e0f2fe; }
.plane-type-btn { color: #fde68a; }
.accent-btn { color: #7dd3fc; }
.edit-btn { border-color: rgba(196, 181, 253, 0.55); color: #ddd6fe; }
.edit-tools { width: 100%; justify-content: center; }

.phys-head { display: flex; justify-content: space-between; align-items: center; }
.phys-title { font-size: 11px; font-weight: 700; color: #7dd3fc; display: flex; align-items: center; gap: 5px; }
.phys-head-right { display: flex; align-items: center; gap: 4px; }
.phase-badge { font-size: 9px; padding: 1px 5px; border-radius: 5px; background: rgba(56, 189, 248, 0.2); color: #bae6fd; }
.phys-close { padding: 1px 6px; font-size: 9.5px; }
.phys-sounding { display: grid; grid-template-columns: 122px 1fr; gap: 6px; align-items: center; }
.sounding-box { background: rgba(3, 7, 18, 0.82); border: 1px solid rgba(51, 65, 85, 0.75); border-radius: 8px; overflow: hidden; height: 78px; }
.sounding-box canvas { width: 100%; height: 100%; display: block; }
.phys-mech { display: flex; flex-direction: column; gap: 3px; }
.phys-mech strong { font-size: 10px; color: #fde68a; }
.phys-mech p { font-size: 9.3px; color: #cbd5e1; line-height: 1.32; }
.evo-block { display: flex; flex-direction: column; gap: 3px; }
.evo-status-row { display: flex; justify-content: space-between; font-size: 9.3px; color: #94a3b8; gap: 6px; }
.phys-sliders { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
.phys-sliders .ctrl-box { padding: 2px 5px; }

.lib-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; border-bottom: 1px solid rgba(148, 163, 184, 0.2); padding-bottom: 7px; }
.lib-title { font-size: 13px; color: #fff; }
.lib-sub { font-size: 11px; color: #94a3b8; margin-left: 8px; }

.hl-label { color: #bae6fd; font-weight: 600; }
.hl-label.sun { color: #fde68a; }
.dock-buttons { display: flex; gap: 3px; }
.dock-buttons .pill-btn { padding: 5px 7px; }

@media (max-width: 640px) {
  .status-hint { display: none; }
  .lib-sub { display: block; margin-left: 0; margin-top: 3px; }
}
</style>
</head>
<body>

  <canvas id="glCanvas" class="mode-cam"></canvas>

  <!-- Top bar: status, tone, time of day, aircraft, tools -->
  <header id="topHud">
    <div class="glass status-pill pointer-auto">
      <span class="live-dot"></span>
      <div>
        <div class="status-line">
          <strong id="cloudTitleText" class="status-title">SkyStudio 360°</strong>
          <span id="compassBadge" class="compass-badge mono">360°</span>
          <span id="fpsBadge" class="mono fps-badge">— FPS</span>
        </div>
        <div id="cloudPhysHint" class="status-hint"></div>
      </div>
    </div>

    <div class="glass tool-group pointer-auto">
      <button id="btnLang" type="button" class="pill-btn lang-btn">🌐 EN</button>
      <button id="btnThemeLibrary" type="button" class="pill-btn library-btn" data-i18n-title="btn.library.title"></button>

      <span class="sep">|</span>
      <button type="button" data-ctone="light" class="pill-btn" data-i18n="btn.tone.light" data-i18n-title="btn.tone.light.title"></button>
      <button type="button" data-ctone="mixed" class="pill-btn active-ctone" data-i18n="btn.tone.mixed" data-i18n-title="btn.tone.mixed.title"></button>
      <button type="button" data-ctone="dark" class="pill-btn" data-i18n="btn.tone.dark" data-i18n-title="btn.tone.dark.title"></button>
      <span class="sep">|</span>

      <button id="btnTodDay" type="button" class="pill-btn active-tod" data-i18n="btn.day" data-i18n-title="btn.day.title"></button>
      <button id="btnTodSunset" type="button" class="pill-btn" data-i18n="btn.sunset" data-i18n-title="btn.sunset.title"></button>
      <button id="btnTodNight" type="button" class="pill-btn" data-i18n="btn.night" data-i18n-title="btn.night.title"></button>
      <button id="btnMoonToggle" type="button" class="pill-btn" data-i18n-title="btn.moon.title"></button>
      <button id="btnSolarEclipse" type="button" class="pill-btn" data-i18n="btn.solar" data-i18n-title="btn.solar.title"></button>
      <button id="btnLunarEclipse" type="button" class="pill-btn" data-i18n="btn.lunar" data-i18n-title="btn.lunar.title"></button>
      <button id="btnSunRaysToggle" type="button" class="pill-btn" data-i18n-title="btn.rays.title"></button>
      <button id="btnBakeToggle" type="button" class="pill-btn active-auto" data-i18n-title="btn.bake.title"></button>
      <button id="btnAutoEvolveToggle" type="button" class="pill-btn active-auto" data-i18n-title="btn.evo.title"></button>
      <button id="btnPhysPanelToggle" type="button" class="pill-btn" data-i18n="btn.phys" data-i18n-title="btn.phys.title"></button>
      <button id="btnPlaneToggle" type="button" class="pill-btn active-auto" data-i18n-title="btn.planes.title">✈️</button>
      <button id="btnPlaneType" type="button" class="pill-btn plane-type-btn" data-i18n-title="btn.planeType.title"></button>
      <button id="btnRespawnPlane" type="button" class="pill-btn accent-btn" data-i18n-title="btn.respawn.title">🚀</button>
      <button id="btnNewSeed" type="button" class="pill-btn accent-btn" data-i18n="btn.seed" data-i18n-title="btn.seed.title"></button>
      <button id="btnToggleEdit" type="button" class="pill-btn edit-btn" data-i18n-title="btn.edit.title"></button>
      <button id="btnEquirectMode" type="button" class="pill-btn" data-i18n-title="btn.equirect.title"></button>
      <button id="btnExport2to1" type="button" class="pill-btn export-btn" data-i18n-title="btn.export.title">💾 PNG</button>
      <button id="btnToggleDock" type="button" class="pill-btn" data-i18n-title="btn.dock.title">👁</button>
    </div>

    <!-- Editing tools: shown only in edit mode -->
    <div id="editToolsGroup" class="glass tool-group pointer-auto edit-only edit-tools">
      <button type="button" data-tool="cam" class="pill-btn active-tool" data-i18n="tool.cam" data-i18n-title="tool.cam.title"></button>
      <button type="button" data-tool="paint_ci" class="pill-btn" data-i18n="tool.paint_ci" data-i18n-title="tool.paint_ci.title"></button>
      <button type="button" data-tool="paint_cu" class="pill-btn" data-i18n="tool.paint_cu" data-i18n-title="tool.paint_cu.title"></button>
      <button type="button" data-tool="paint_cc" class="pill-btn" data-i18n="tool.paint_cc" data-i18n-title="tool.paint_cc.title"></button>
      <button type="button" data-tool="erase" class="pill-btn" data-i18n="tool.erase" data-i18n-title="tool.erase.title"></button>
      <span class="sep">|</span>
      <button type="button" data-bmode="light" class="pill-btn active-bmode" data-i18n="bmode.light" data-i18n-title="bmode.light.title"></button>
      <button type="button" data-bmode="soft3d" class="pill-btn" data-i18n="bmode.soft3d" data-i18n-title="bmode.soft3d.title"></button>
      <button type="button" data-bmode="dense" class="pill-btn" data-i18n="bmode.dense" data-i18n-title="bmode.dense.title"></button>
      <span class="sep">|</span>
      <button type="button" data-tool="wind" class="pill-btn" data-i18n="tool.wind" data-i18n-title="tool.wind.title"></button>
      <button type="button" data-tool="sun" class="pill-btn" data-i18n="tool.sun" data-i18n-title="tool.sun.title"></button>
      <button type="button" data-tool="moon" class="pill-btn" data-i18n="tool.moon" data-i18n-title="tool.moon.title"></button>
    </div>
  </header>

  <!-- Cloud physics card: thermodynamics T(z) and evolution modes -->
  <aside id="physicsHudCard" class="glass pointer-auto hidden-phys">
    <div class="phys-head">
      <span class="phys-title"><span class="live-dot"></span><span data-i18n="phys.title"></span></span>
      <div class="phys-head-right">
        <span id="physPhaseBadge" class="mono phase-badge"></span>
        <button id="btnMinimizePhys" type="button" class="pill-btn phys-close" data-i18n-title="phys.close.title">✕</button>
      </div>
    </div>

    <div class="phys-metrics-grid">
      <div data-i18n-title="phys.lcl.title">
        <span class="phys-m-lbl" data-i18n="phys.lcl"></span>
        <span id="physValLCL" class="phys-m-val mono" style="color:#38bdf8;"></span>
      </div>
      <div data-i18n-title="phys.el.title">
        <span class="phys-m-lbl" data-i18n="phys.el"></span>
        <span id="physValEL" class="phys-m-val mono" style="color:#a78bfa;"></span>
      </div>
      <div data-i18n-title="phys.cape.title">
        <span class="phys-m-lbl" data-i18n="phys.cape"></span>
        <span id="physValCAPE" class="phys-m-val mono" style="color:#fbbf24;"></span>
      </div>
      <div data-i18n-title="phys.shear.title">
        <span class="phys-m-lbl" data-i18n="phys.shear"></span>
